# Lab 13 · Nhiệm vụ D · Kế hoạch pilot trợ lý hoàn phí LogiX-VN (Gate 2a)
# Điền mọi chỗ có dấu hỏi. Khi nộp, ngoài các dòng chú thích không còn dấu hỏi nào.
# Kiểm tra đọc được: python -c "import yaml; yaml.safe_load(open('../report/team/pilot_plan.yaml'))"
#
# D1 · Cỡ mẫu (baseline 0,70; mục tiêu +5 điểm; alpha 0,05; power 0,8; ICC 0,02)
#   a) Chia theo yêu cầu: 1.251 yêu cầu mỗi nhóm (n_per_arm = 1.251).
#   b) Theo nhân viên, m = 75: DE = 1 + 74 * 0,02 = 2,48; n = 1.251 * 2,48 = 3.103 mỗi nhóm -> 42 người/nhóm (tổng 84 > 40 nhân viên: KHÔNG ĐỦ NGƯỜI).
#   c) 20 nhân viên mỗi nhóm: cỡ mẫu hiệu dụng tối đa c / ICC = 20 / 0,02 = 1.000 < 1.251 (KHÔNG ĐẠT MDE +5 điểm).
#   d) 6 depot mỗi nhóm: cỡ mẫu hiệu dụng tối đa 6 / 0,02 = 300 < 1.251 (LOẠI vì dưới 20 cụm và thiếu mẫu nặng).
#   e) Mức chênh 6 điểm (859 mỗi nhóm), 20 nhân viên mỗi nhóm: 20m / (1 + (m - 1)*0,02) >= 859 -> m >= 299 yêu cầu mỗi nhân viên (DE = 6,96; n_eff = 859).
#
# D2 · Năm câu kiểm tra "tách được tác động" với cách chia đã chọn (mỗi câu một dòng):
#   1. Đối chứng chạy cùng thời gian: Có, 20 nhân viên đối chứng làm song song cùng tuần và cùng 12 depot với 20 nhân viên dùng trợ lý.
#   2. Chia ngẫu nhiên hay do người chọn: Chia ngẫu nhiên hoàn toàn bằng code với seed cố định ghi trước (20261125), phân tầng theo depot.
#   3. Ảnh hưởng gián tiếp và cách giảm: Rủi ro nhân viên cùng depot chia sẻ câu trả lời; giảm bằng phân quyền theo tài khoản và log mọi lượt mở trợ lý theo staff_id.
#   4. Chỉ số chính, ngưỡng, ngày quyết định đã viết trước: Có, tất cả chỉ số, MDE 0,06, 3 luật dừng và ngày 2027-01-05 chốt trước ngày chạy.
#   5. Ít nhất 20 cụm mỗi nhóm: Có, đúng 20 nhân viên (cụm) cho mỗi nhóm can thiệp và đối chứng.
#
# Đánh đổi đã chấp nhận (nếu cách chia chưa đạt cả hai điều kiện):
#   Với tổng 40 nhân viên, không cách chia theo cụm nào đủ mẫu cho MDE +5 điểm (trần 1.000 < 1.251).
#   Nhóm chấp nhận nâng MDE lên +6 điểm (m >= 299 yêu cầu/nhân viên trong bước 0.50); nếu tác động thật chỉ là +5 điểm thì power giảm còn khoảng 0,64 (ở n = 859).
#   Thời gian thu thập ở bước 0.50 (20 nhân viên): 1.500/40 ~ 37-38 đơn/người/ngày nên 7 ngày chỉ đạt ~263 < 299; cần ít nhất 8 ngày toàn tải (hoặc ~10 ngày cho riêng phạm vi noi_dia + hang_nang ~31 đơn/người/ngày), CỘNG THÊM 7 ngày chờ cửa sổ bảo hành mo_lai_trong_7_ngay cho đơn cuối rồi mới họp chốt (không họp vào ngày thứ 7).
#
# Tỉ lệ mo_lai_trong_7_ngay hiện tại và ngưỡng an toàn đã chọn:
#   Hiện tại là 4,25% toàn mẫu (51/1.200) và 3,97% trong phạm vi noi_dia + hang_nang (39/982).
#   Nếu đặt trần tuyệt đối 3% sẽ khiến pilot dừng ngay tuần đầu, nên áp dụng ngưỡng kép: ngưỡng cứng (> 6%, hoàn trùng, báo đã hoàn không ghi sổ) bật từ bước 0.10 (4 người), còn ngưỡng lệch >= 2 điểm so với đối chứng chỉ bật từ bước 0.25 (10 người; tránh báo động giả 56/1.000 ở 4 người so với 8/1.000 ở 10 người).
#   Ngưỡng chi phí 8.000 đ ở stop_rules chỉ tính chi phí biến đổi (token + tool + giờ người ~ 3.414 đ, không cộng 40 triệu đ/tháng cố định kẻo nổ giả ~15.300 đ ở 4 người hay ~8.200 đ ở 10 người).

pilot:
  owner: "Giám đốc vận hành LogiX-VN"
  scope: "Chỉ áp dụng cho noi_dia (2.696 đ = 0,22x baseline, simulated) và hang_nang (8.221 đ = 0,69x baseline, simulated) tại 12 depot; loại quoc_te (22.515 đ = 1,88x, simulated) và doi_tac (10.215 đ = 0,85x, simulated)"
