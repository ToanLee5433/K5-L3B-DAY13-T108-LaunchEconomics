    - "NẾU tỉ lệ bỏ qua gợi ý (sửa hoặc bỏ) vượt 40% TRONG 1 tuần (hiện tại đợt chạy thử là 27,12%) THÌ Trưởng nhóm CSKH tạm dừng mở rộng, phỏng vấn tối thiểu 5 nhân viên trong 3 ngày để sửa quy trình gợi ý KHÔNG THÌ không được nâng từ bước 0.25 lên 0.50"
  interim_looks: "chỉ kiểm tra chỉ số an toàn"
  rollback: "Giám đốc vận hành bật cờ tắt tính năng (kill-switch) trợ lý theo từng depot hoặc toàn bộ, có hiệu lực trong 30 phút; toàn bộ yêu cầu chuyển ngay về luồng nhân viên CSKH tự xử lý (baseline 6 phút = 12.000 đ/yêu cầu)"
