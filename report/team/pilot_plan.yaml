  stop_rules:
    - "NẾU ở mọi bước rollout (kể cả bước 0.10 gồm 4 nhân viên) tỉ lệ mở lại trong 7 ngày vượt 6%, hoặc phát sinh >= 1 ca hoàn trùng sổ cái, hoặc có >= 1 ca nhắn khách đã hoàn nhưng sổ cái không ghi; HOẶC từ bước 0.25 (10 nhân viên) trở lên tỉ lệ mở lại 7 ngày của nhóm trợ lý cao hơn đối chứng >= 2 điểm phần trăm TRONG 3 ngày liên tiếp THÌ Giám đốc vận hành bật cờ tắt trợ lý trong 30 phút KHÔNG THÌ không được chuyển sang bước rollout tiếp theo"
